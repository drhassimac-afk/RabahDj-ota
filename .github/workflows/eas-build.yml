name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Source
        run: |
          EAS_SKIP_AUTO_FINGERPRINT=1 npx expo prebuild --platform android --clean

      - name: Inject Sentry Disable into Gradle
        run: |
          sed -i '/apply from: "..\/node_modules\/@sentry\/react-native\/sentry.gradle"/i project.ext.sentry = [ disableAutoUpload: true ]' android/app/build.gradle

      - name: Add debug signing configuration
        run: |
          sed -i '/signingConfigs {/a\
              release {\
                  storeFile file("debug.keystore")\
                  storePassword "android"\
                  keyAlias "androiddebugkey"\
                  keyPassword "android"\
              }' android/app/build.gradle
          sed -i '/buildTypes {/,/release {/{/release {/a\
                  signingConfig signingConfigs.release
          }' android/app/build.gradle

      - name: Build Release APK Bundle
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Psentry.disableAutoUpload=true

      - name: Upload APK to Stable Free Hosting (bashupload)
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ ! -z "$APK_PATH" ]; then
            echo "[*] Found compiled APK at: $APK_PATH"
            echo "[*] Uploading to bashupload.com due to GitHub storage quota limit..."
            # الرفع عبر النفق المستقر لتوليد رابط تحميل فوري مباشر
            UPLOAD_URL=$(curl -F "file=@$APK_PATH" https://bashupload.com)
            echo "======================================================="
            echo "🔥 رابط تحميل تطبيق الـ APK الفوري والمكتمل الخاص بك هو:"
            echo "$UPLOAD_URL"
            echo "======================================================="
          else
            echo "[!] APK file not found!"
            exit 1
          fi
