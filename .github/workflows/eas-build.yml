name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Source
        run: |
          EAS_SKIP_AUTO_FINGERPRINT=1 npx expo prebuild --platform android --clean

      - name: Inject Sentry Disable into Gradle
        run: |
          # حقن كود التعطيل مباشرة بعد إنشاء المجلد وقبل التجميع لضمان عدم حذفه
          sed -i '/apply from: "..\/node_modules\/@sentry\/react-native\/sentry.gradle"/i project.ext.sentry = [ disableAutoUpload: true ]' android/app/build.gradle

      - name: Add debug signing configuration
        run: |
          sed -i '/signingConfigs {/a\
              release {\
                  storeFile file("debug.keystore")\
                  storePassword "android"\
                  keyAlias "androiddebugkey"\
                  keyPassword "android"\
              }' android/app/build.gradle
          sed -i '/buildTypes {/,/release {/{/release {/a\
                  signingConfig signingConfigs.release
          }' android/app/build.gradle

      - name: Build Release APK Bundle (Strict Sentry Override)
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Psentry.disableAutoUpload=true

      - name: Upload Clean Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: RabahDj-YacineTV-APK
          path: android/app/build/outputs/apk/release/*.apk
