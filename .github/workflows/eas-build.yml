name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Source
        run: |
          EAS_SKIP_AUTO_FINGERPRINT=1 npx expo prebuild --platform android --clean

      - name: Generate and Move Debug Keystore File
        run: |
          # توليد شهادة التوقيع التلقائية المطلوبة للبناء مباشرة داخل مجلد أندرويد
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Add debug signing configuration to gradle file
        run: |
          sed -i '/signingConfigs {/a\
              release {\
                  storeFile file("debug.keystore")\
                  storePassword "android"\
                  keyAlias "androiddebugkey"\
                  keyPassword "android"\
              }' android/app/build.gradle
          sed -i '/buildTypes {/,/release {/{/release {/a\
                  signingConfig signingConfigs.release
          }' android/app/build.gradle

      - name: Build Release APK Bundle via Gradlew
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Clean Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: RabahDj-YacineTV-APK
          path: android/app/build/outputs/apk/release/*.apk
