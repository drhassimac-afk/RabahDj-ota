name: ota-update
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'وصف التحديث'
        required: true
        default: 'OTA update'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # ← كان 20 — eas-cli الحديث يطلب >=22
          cache: npm

      - name: Install dependencies (npm)
        run: npm ci

      - name: Install eas-cli (npm, pinned)
        run: npm install -g eas-cli@13.4.2   # إصدار مثبت مستقر مع Node 22

      - name: Publish EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --branch preview --environment preview \
            --non-interactive -m "${{ inputs.message }}"
