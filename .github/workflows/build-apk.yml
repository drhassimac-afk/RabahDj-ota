name: Build Production APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: |
          EAS_SKIP_AUTO_FINGERPRINT=1 npx expo prebuild --platform android --clean

      - name: Disable Sentry Compilation
        run: |
          sed -i '/apply from: "..\/node_modules\/@sentry\/react-native\/sentry.gradle"/i project.ext.sentry = [ disableAutoUpload: true ]' android/app/build.gradle

      - name: Inject Keystore Configuration
        run: |
          sed -i '/signingConfigs {/a\
              release {\
                  storeFile file("debug.keystore")\
                  storePassword "android"\
                  keyAlias "androiddebugkey"\
                  keyPassword "android"\
              }' android/app/build.gradle
          sed -i '/buildTypes {/,/release {/{/release {/a\
                  signingConfig signingConfigs.release
          }' android/app/build.gradle

      - name: Build Pure Release APK
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Psentry.disableAutoUpload=true

      - name: Secure External Artifact Upload
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ ! -z "$APK_FILE" ]; then
            echo "[*] Target file verified at: $APK_FILE"
            echo "[*] Transmitting via secure stable tunneling..."
            
            # محاولة الرفع الأولى عبر السيرفر الرئيسي المستقر
            UPLOAD_URL=$(curl --upload-file "$APK_FILE" https://transfer.sh)
            
            # خطة احتياطية في حال فشل الـ DNS أو الشبكة في السيرفر الأول
            if [ -z "$UPLOAD_URL" ] || [[ "$UPLOAD_URL" != http* ]]; then
              echo "[*] Primary server down, shifting to fallback servers..."
              UPLOAD_URL=$(curl -F "file=@$APK_FILE" https://file.io | jq -r '.link')
            fi

            echo "======================================================="
            echo "🔥 رابط تحميل تطبيق الـ APK الفوري والمكتمل الخاص بك هو:"
            echo "$UPLOAD_URL"
            echo "======================================================="
          else
            echo "[!] Compiling failed, APK not found!"
            exit 1
          fi
