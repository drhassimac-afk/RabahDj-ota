name: Build Production APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # منح السيرفر صلاحية إنشاء Release رسمي داخل مستودعك
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: |
          EAS_SKIP_AUTO_FINGERPRINT=1 npx expo prebuild --platform android --clean

      - name: Disable Sentry Compilation
        run: |
          sed -i '/apply from: "..\/node_modules\/@sentry\/react-native\/sentry.gradle"/i project.ext.sentry = [ disableAutoUpload: true ]' android/app/build.gradle

      - name: Inject Keystore Configuration
        run: |
          sed -i '/signingConfigs {/a\
              release {\
                  storeFile file("debug.keystore")\
                  storePassword "android"\
                  keyAlias "androiddebugkey"\
                  keyPassword "android"\
              }' android/app/build.gradle
          sed -i '/buildTypes {/,/release {/{/release {/a\
                  signingConfig signingConfigs.release
          }' android/app/build.gradle

      - name: Build Pure Release APK
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Psentry.disableAutoUpload=true

      - name: Rename and Prepare APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" ./RabahDj-YacineTV.apk

      - name: Create Official GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RabahDj YacineTV Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./RabahDj-YacineTV.apk
          token: ${{ secrets.GITHUB_TOKEN }}
