name: Build Production APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fix notification listener BuildType ambiguity
        run: |
          F="node_modules/react-native-android-notification-listener/android/build.gradle"
          if [ -f "$F" ] && ! grep -q "CI fix" "$F"; then
            {
              echo ""
              echo "// CI fix: resolve react-native variant ambiguity"
              echo "configurations.getByName('implementation').attributes.attribute("
              echo "    com.android.build.api.attributes.BuildTypeAttr.ATTRIBUTE,"
              echo "    project.objects.named(com.android.build.api.attributes.BuildTypeAttr, 'release')"
              echo ")"
            } >> "$F"
            echo "Patched $F"
          else
            echo "Nothing to patch"
          fi

      - name: Fix Gradle 9 compatibility in notification listener
        run: |
          F="node_modules/react-native-android-notification-listener/android/build.gradle"
          if [ -f "$F" ]; then
            sed -i -E 's/^([[:space:]]*)classifier[[:space:]]*=?[[:space:]]*/\1archiveClassifier = /' "$F"
          fi

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EAS_SKIP_AUTO_FINGERPRINT: '1'

      - name: Pin Gradle to 8.14.3
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#gradle-[0-9.]+-(bin|all)\.zip#gradle-8.14.3-bin.zip#' "$P"
          grep distributionUrl "$P"

      - name: Remove jcenter references
        run: |
          if [ -d "android" ]; then
            sed -i '/jcenter()/d' android/build.gradle 2>/dev/null || true
            sed -i '/jcenter()/d' android/settings.gradle 2>/dev/null || true
            sed -i '/jcenter()/d' android/app/build.gradle 2>/dev/null || true
          fi
          find node_modules/ -name "build.gradle" -type f -exec sed -i '/jcenter()/d' {} + 2>/dev/null || true

      - name: Disable Sentry auto upload
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i '/apply from: "..\/node_modules\/@sentry\/react-native\/sentry.gradle"/i project.ext.sentry = [ disableAutoUpload: true ]' android/app/build.gradle || true
          fi

      - name: Build release APK
        working-directory: android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon -Psentry.disableAutoUpload=true

      - name: Prepare APK
        run: |
          set -e
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          cp "$APK_FILE" ./RabahDj-YacineTV.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RabahDj YacineTV Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./RabahDj-YacineTV.apk
          token: ${{ secrets.GITHUB_TOKEN }}
